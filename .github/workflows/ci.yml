name: CI

on:
  push:
    branches:
      - main
    paths:
      - "bucket/**"
      - "scripts/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/update-manifests.yml"
  pull_request:
    paths:
      - "bucket/**"
      - "scripts/**"
      - ".github/workflows/ci.yml"
      - ".github/workflows/update-manifests.yml"

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate manifests and embedded PowerShell hooks
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $manifests = Get-ChildItem -LiteralPath ./bucket -Filter '*.json' -File | Sort-Object Name
          if (-not $manifests) { throw 'No manifests found in bucket/.' }

          foreach ($file in $manifests) {
            Write-Host "Validating $($file.Name)..."
            $m = Get-Content -LiteralPath $file.FullName -Raw | ConvertFrom-Json

            foreach ($req in @('version', 'description', 'homepage', 'license')) {
              if (-not $m.$req) { throw "$($file.Name) is missing required field '$req'." }
            }
            if (-not $m.url -and -not $m.architecture) {
              throw "$($file.Name) must define 'url' or 'architecture'."
            }

            $hookGroups = @(
              @{ Name = 'pre_install'; Value = $m.pre_install },
              @{ Name = 'post_install'; Value = $m.post_install },
              @{ Name = 'pre_uninstall'; Value = $m.pre_uninstall },
              @{ Name = 'post_uninstall'; Value = $m.post_uninstall },
              @{ Name = 'installer.script'; Value = $m.installer.script },
              @{ Name = 'uninstaller.script'; Value = $m.uninstaller.script }
            )
            foreach ($hook in $hookGroups) {
              if ($null -eq $hook.Value) { continue }
              $code = if ($hook.Value -is [System.Array]) { $hook.Value -join "`n" } else { [string]$hook.Value }
              $errors = $null
              $null = [System.Management.Automation.Language.Parser]::ParseInput($code, [ref]$null, [ref]$errors)
              if ($errors.Count -gt 0) {
                throw "$($file.Name) $($hook.Name) PowerShell syntax error: $($errors | Out-String)"
              }
            }
          }

      - name: Validate PowerShell scripts and run unit tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem -LiteralPath ./scripts -Filter '*.ps1' -File | Sort-Object Name | ForEach-Object {
            $errors = $null
            $null = [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors)
            if ($errors.Count -gt 0) {
              throw "$($_.Name) syntax error: $($errors | Out-String)"
            }
          }

          Get-ChildItem -LiteralPath ./scripts -Filter 'Test-*.ps1' -File | Sort-Object Name | ForEach-Object {
            Write-Host "Running $($_.Name)..."
            & $_.FullName
          }

name: Update MDView

on:
  workflow_dispatch:
  schedule:
    - cron: "31 19 * * *"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Update manifest
        shell: pwsh
        run: ./scripts/Update-MDView.ps1

      - name: Validate manifest JSON
        shell: pwsh
        run: |
          Get-Content ./bucket/mdview.json -Raw | ConvertFrom-Json | Out-Null

      - name: Commit changes
        shell: pwsh
        run: |
          if (-not (git status --porcelain -- bucket/mdview.json)) {
            Write-Host "No MDView update found."
            exit 0
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bucket/mdview.json
          git commit -m "Update MDView manifest"
          git push
